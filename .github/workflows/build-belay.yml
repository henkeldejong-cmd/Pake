name: Build Belay Homepage App

on:
  push:
    branches:
      - main
    paths:
      - "belay-plugins/**"
      - "belay-site/**"
      - ".github/workflows/build-belay.yml"
  workflow_dispatch:

jobs:
  build-belay-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Check combined JS syntax
        shell: bash
        run: |
          cat belay-plugins/belay-shim.js belay-plugins/all-in-one-toolkit.js belay-plugins/bypass-paywall.js belay-plugins/explain-x.js belay-plugins/inline-summaries.js belay-plugins/olympus-tts.js belay-plugins/refined-dark-theme.js > combined-check.js
          node --check combined-check.js
          rm combined-check.js

      - name: Setup Pake environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build Pake CLI
        run: pnpm run cli:build

      - name: Build Belay Homepage MSI
        run: node dist/cli.js ./belay-site/Belay_Homepage.html --use-local-file --name "Belay Homepage" --identifier com.pake.belay.custom --width 1280 --height 760 --maximize --no-restore-last-url --internal-url-regex "^https?://" --inject ./belay-plugins/belay-shim.js --inject ./belay-plugins/all-in-one-toolkit.js --inject ./belay-plugins/bypass-paywall.js --inject ./belay-plugins/explain-x.js --inject ./belay-plugins/inline-summaries.js --inject ./belay-plugins/olympus-tts.js --inject ./belay-plugins/refined-dark-theme.js

      - name: Upload Belay Homepage MSI
        uses: actions/upload-artifact@v4
        with:
          name: custom-belay-msi
          path: "*.msi"
          if-no-files-found: error

name: Build My Custom Facebook App

on:
  push:
    branches:
      - main
    paths:
      - "fb-plugins/**"
      - ".github/workflows/build-facebook.yml"
  workflow_dispatch:

jobs:
  build-facebook-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup Pake environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build Pake CLI
        run: pnpm run cli:build

      - name: Build Custom Facebook MSI
        run: node dist/cli.js https://www.facebook.com --name "Facebook" --identifier com.pake.facebook.custom --width 1200 --height 800 --new-window --no-restore-last-url

      - name: Upload Facebook MSI
        uses: actions/upload-artifact@v4
        with:
          name: custom-facebook-msi
          path: "*.msi"
          if-no-files-found: error

name: Build My Custom Facebook App

on:
  push:
    branches:
      - main
    paths:
      - "fb-plugins/**"
      - ".github/workflows/build-facebook.yml"
  workflow_dispatch:

jobs:
  build-facebook-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Check combined JS syntax
        shell: bash
        run: |
          cat fb-plugins/fb-shim.js fb-plugins/all-in-one-toolkit.js fb-plugins/explainx.js fb-plugins/facebook-ad-remover-light.js fb-plugins/fb-pro-playlist.js fb-plugins/inline-summaries.js fb-plugins/post-tools.js > combined-check.js
          node --check combined-check.js
          rm combined-check.js

      - name: Setup Pake environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build Pake CLI
        run: pnpm run cli:build

      - name: Build Custom Facebook MSI
        run: node dist/cli.js https://www.facebook.com --name "Facebook" --identifier com.pake.facebook.mobile --width 1280 --height 760 --maximize --new-window --no-restore-last-url --inject ./fb-plugins/fb-shim.js --inject ./fb-plugins/all-in-one-toolkit.js --inject ./fb-plugins/explainx.js --inject ./fb-plugins/facebook-ad-remover-light.js --inject ./fb-plugins/fb-pro-playlist.js --inject ./fb-plugins/inline-summaries.js --inject ./fb-plugins/post-tools.js

      - name: Upload Facebook MSI
        uses: actions/upload-artifact@v4
        with:
          name: custom-facebook-msi
          path: "*.msi"
          if-no-files-found: error
